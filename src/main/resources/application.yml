logging:
  level:
    root: info
    com.czetsuyatech: debug
    org.springframework: info
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: error

spring:
  # Datasource Configuration
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/czetsuyatech
    driver-class-name: org.postgresql.Driver
    username: unifiedevents
    password: unifiedevents
    hikari:
      schema: unifiedevents
      pool-name: unifiedevents-pool
      connection-test-query: SELECT 1
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      jdbc-url: ${spring.datasource.url}
      username: ${spring.datasource.username}
      password: ${spring.datasource.password}

  # JPA Configuration
  jpa:
    generate-ddl: false
    open-in-view: false
    show-sql: false
    database: postgresql
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 5
          time_zone: "UTC"
        generate_statistics: false
        format_sql: true
        enable_lazy_load_no_trans: true # This anti-pattern/trade-off is only set to unblock further development
        log:
          non_contextual_creation: true

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    default-schema: ${spring.datasource.hikari.schema}
    fail-on-missing-locations: true

unified-kafka-events:
  enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer-group: Lab
    retry-delay: 120
    max-retry-attempts: 5
    properties:
      version: 1
    inbound:
      retry-cron: 0 0/2 * ? * *
      retry-chunk-size: 50
      clean-cron: 0 0 0 ? 1/6 *
      clean-lifespan: 100
      topics:
        events-processed:
          name: Unified.Kafka.Event.Processed
          consumer-number: 1
        events-failed:
          name: Unified.Kafka.Event.Failed
          consumer-number: 1
        events-ignored:
          name: Unified.Kafka.Event.Ignored
          consumer-number: 1
        events-retried:
          name: Unified.Kafka.Event.Retried
          consumer-number: 1
        events-retried-retry:
          name: Unified.Kafka.Event.Retried-retry
          consumer-number: 1

    outbound:
      retry-cron: 0 0/2 * ? * *
      retry-chunk-size: 50
      clean-cron: 0 0 0 ? 1/6 *
      clean-lifespan: 100
      topics:
        events-processed:
          name: Unified.Kafka.Event.Processed
        events-failed:
          name: Unified.Kafka.Event.Failed
        events-ignored:
          name: Unified.Kafka.Event.Ignored
        events-retried:
          name: Unified.Kafka.Event.Retried
        events-retried-retry:
          name: Unified.Kafka.Event.Retried-retry
